<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONTS_URL}}">
<style>
/* Layout: a dated engineering log. A left rail says when each piece of work happened; the story runs beside it. */
:root {
{{TOKENS_LIGHT}}
  --display:{{FONT_DISPLAY}},system-ui,sans-serif;
  --body:{{FONT_BODY}},system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:{{FONT_MONO}},ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
{{TOKENS_DARK}}
  color-scheme:dark;
} }
:root[data-theme="dark"] {
{{TOKENS_DARK}}
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--body);margin:0}
img{max-width:100%}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h2{font-size:clamp(1.65rem,1.3rem + 1.4vw,2.35rem);line-height:1.12;font-weight:700}
h3{font-size:1.15rem;line-height:1.3;font-weight:650;letter-spacing:-.005em}
p{margin:0}
code{font:400 .84em var(--mono);background:var(--note);padding:.08em .32em;border-radius:3px;overflow-wrap:anywhere}
.hero{background:var(--band);color:var(--band-ink);padding-block:clamp(36px,6vw,72px) 0}
.hero.noshots{padding-block-end:clamp(28px,4vw,48px)}
.hero a{color:var(--highlight)}
.eyebrow{font:500 .76rem/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--highlight)}
.hero h1{font-size:clamp(2.45rem,1.5rem + 4.6vw,5rem);line-height:1;font-weight:750;letter-spacing:-.03em;margin-top:18px;max-width:17ch}
.lede{font-size:clamp(1.08rem,1rem + .4vw,1.3rem);line-height:1.55;max-width:62ch;margin-top:24px;color:var(--band-ink)}
.hero code{background:var(--band-rule);color:var(--band-ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 28px;margin:34px 0 0;padding:20px 0;border-top:1px solid var(--band-rule)}
.facts dt{font:500 .72rem/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--band-muted)}
.facts dd{margin:4px 0 0;font-size:.98rem;line-height:1.4}
.shots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.262fr);gap:clamp(10px,2vw,22px);align-items:end;margin-top:26px;margin-bottom:-60px;position:relative}
.shots.single{grid-template-columns:minmax(0,1fr)}
.shots img{display:block;width:100%;height:auto;border-radius:10px 10px 0 0;box-shadow:0 14px 44px rgba(0,0,0,.4)}
.shots img.phone{border-radius:14px 14px 0 0}
.shot-note{padding-top:72px;font:400 .78rem/1.5 var(--mono);color:var(--muted)}
.noshots + main .shot-note{padding-top:24px}
section.entry{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 36px;padding-block:clamp(38px,5vw,62px);border-top:1px solid var(--rule)}
section.entry.first{border-top:0}
.rail{font:500 .78rem/1.45 var(--mono);color:var(--accent);padding-top:.5rem}
.rail span{display:block;color:var(--muted);font-weight:400}
.col{min-width:0;display:grid;gap:18px}
.col>p,.col>ul,.col>h2,.col>h3{max-width:68ch}
.col>h3{margin-top:12px}
ul.tight{margin:0;padding-left:1.15em;display:grid;gap:8px}
ul.tight li::marker{color:var(--accent)}
strong{font-weight:600}
figure{margin:8px 0;min-width:0}
figcaption{font-size:.9rem;line-height:1.5;color:var(--muted);margin-top:10px;max-width:68ch}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.scroll svg{display:block;width:100%;height:auto;min-width:680px}
.shot{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--rule)}
.d-box{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.d-zone{fill:var(--note);stroke:var(--rule);stroke-width:1}
.d-t{font:600 13px var(--body);fill:var(--ink)}
.d-s{font:400 11.5px var(--mono);fill:var(--muted)}
.d-z{font:500 11.5px var(--mono);fill:var(--muted)}
.d-l{stroke:var(--ink);stroke-width:1.3;fill:none}
.d-dash{stroke-dasharray:5 4}
.d-life{stroke:var(--rule);stroke-width:1.2}
.d-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.d-at{font:600 12px var(--body);fill:var(--accent)}
.d-m{fill:var(--ink)} .d-ma{fill:var(--accent)}
.d-check{fill:var(--note);stroke:var(--accent);stroke-width:1.6}
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px clamp(12px,2.2vw,24px) 12px}
.chart .in{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:600px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.9rem;margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.c-me{fill:var(--me)} .c-team{fill:var(--team)}
.g-grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.g-base{stroke:var(--ink);stroke-width:1.2}
.g-tick{stroke:var(--muted);stroke-width:1}
.g-ax{font:400 11px var(--mono);fill:var(--muted)}
.g-m{font:500 12px var(--mono);fill:var(--ink)}
.g-v{font:500 10.5px var(--mono);fill:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 24px;margin-top:6px}
.totals div{border-top:1px solid var(--rule);padding-top:8px}
.totals b{display:block;font:650 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.totals small{display:block;font:400 .78rem/1.45 var(--mono);color:var(--muted)}
.ranges{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px clamp(12px,2.2vw,24px);display:grid;gap:16px}
.row-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;font-size:.94rem;margin-bottom:6px}
.row-h span{font:400 .78rem/1.7 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:30px;background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px);background-size:25% 100%;border-right:1px solid var(--rule)}
.bar{position:absolute;height:12px;border-radius:0 3px 3px 0;min-width:4px}
.bar.b{top:2px;background:var(--before)} .bar.a{top:16px;background:var(--me)}
.axis{display:flex;justify-content:space-between;font:400 .74rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
pre{margin:0;overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font:400 .8rem/1.75 var(--mono)}
pre .t{color:var(--accent);font-weight:500;margin-right:1.2ch}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem;min-width:520px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.split>div{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:0}
.split h3{margin-bottom:10px;display:flex;align-items:center;gap:9px}
.split h3 i{width:11px;height:11px;border-radius:2px;display:inline-block}
.split ul{font-size:.95rem}
.defs{display:grid;gap:0;margin:0;border-top:1px solid var(--rule)}
.defs>div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 22px;padding:14px 0;border-bottom:1px solid var(--rule)}
.defs dt{font-family:var(--display);font-weight:650;line-height:1.35}
.defs dd{margin:0;font-size:.97rem;max-width:62ch}
.muted{font-size:.9rem;color:var(--muted)}
footer{border-top:1px solid var(--rule);padding-block:32px 56px;color:var(--muted);font-size:.9rem;line-height:1.6}
footer h3{color:var(--ink);margin-bottom:6px}
footer p{max-width:76ch}
.stack{font:400 .8rem/1.8 var(--mono);color:var(--muted)}
@media (max-width:780px){
  section.entry{grid-template-columns:minmax(0,1fr);gap:10px}
  .rail{padding-top:0}.rail span{display:inline;margin-left:.6ch}
  .defs>div{grid-template-columns:minmax(0,1fr)}
}
</style>
{{BODY}}
